[project]
name = "qr-wiki"
version = "0.1.0"
description = "A wiki system with QR code generation for physical documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[project.scripts]
generate-qr = "scripts.generate_qr_codes:main"

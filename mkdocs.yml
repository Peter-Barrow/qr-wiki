site_name: Lab Equipment Wiki
site_description: Quick reference guides with QR codes for lab equipment
site_url: https://yourusername.github.io/qr-wiki

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Equipment:
    - Oscilloscope: equipment/oscilloscope.md
    - Multimeter: equipment/multimeter.md
    - Soldering Station: equipment/soldering-station.md
  - Safety:
    - General Lab Safety: safety/general.md
  - QR Codes: qr-codes.md
